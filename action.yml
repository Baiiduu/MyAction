name: "Echo Environment Variables"
description: "Echo selected GitHub Actions environment variables."

inputs:
  extra-env-names:
    description: "Comma-separated environment variable names to echo in addition to the defaults."
    required: false
    default: ""
  webhook-url:
    description: "Optional URL to receive the echoed environment variables as a JSON POST body."
    required: false
    default: ""
  webhook-token:
    description: "Optional bearer token sent in the Authorization header when posting to the webhook."
    required: false
    default: ""
  fail-on-send-error:
    description: "Whether to fail the action when sending to the webhook fails."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Echo environment variables
      shell: bash
      env:
        EXTRA_ENV_NAMES: ${{ inputs.extra-env-names }}
        WEBHOOK_URL: ${{ inputs.webhook-url }}
        WEBHOOK_TOKEN: ${{ inputs.webhook-token }}
        FAIL_ON_SEND_ERROR: ${{ inputs.fail-on-send-error }}
      run: |
        DEFAULT_ENV_NAMES="GITHUB_ACTION,GITHUB_ACTION_PATH,GITHUB_ACTOR,GITHUB_BASE_REF,GITHUB_EVENT_NAME,GITHUB_HEAD_REF,GITHUB_JOB,GITHUB_REF,GITHUB_REF_NAME,GITHUB_REPOSITORY,GITHUB_RUN_ATTEMPT,GITHUB_RUN_ID,GITHUB_RUN_NUMBER,GITHUB_SHA,GITHUB_WORKFLOW,GITHUB_WORKSPACE,RUNNER_ARCH,RUNNER_NAME,RUNNER_OS,RUNNER_TEMP,RUNNER_TOOL_CACHE"

        echo "$DEFAULT_ENV_NAMES,$EXTRA_ENV_NAMES" | tr ',' '\n' | while IFS= read -r name; do
          name="$(echo "$name" | xargs)"
          if [ -n "$name" ]; then
            if [[ "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              echo "$name=${!name}"
            else
              echo "Skipping invalid environment variable name: $name"
            fi
          fi
        done

        if [ -n "$WEBHOOK_URL" ]; then
          payload_file="$(mktemp)"

          DEFAULT_ENV_NAMES="$DEFAULT_ENV_NAMES" node -e '
            const names = [
              ...process.env.DEFAULT_ENV_NAMES.split(","),
              ...process.env.EXTRA_ENV_NAMES.split(","),
            ]
              .map((name) => name.trim())
              .filter((name) => /^[A-Za-z_][A-Za-z0-9_]*$/.test(name));

            const uniqueNames = [...new Set(names)];
            const values = Object.fromEntries(
              uniqueNames.map((name) => [name, process.env[name] ?? ""])
            );

            const payload = {
              repository: process.env.GITHUB_REPOSITORY ?? "",
              run_id: process.env.GITHUB_RUN_ID ?? "",
              run_number: process.env.GITHUB_RUN_NUMBER ?? "",
              workflow: process.env.GITHUB_WORKFLOW ?? "",
              event_name: process.env.GITHUB_EVENT_NAME ?? "",
              ref: process.env.GITHUB_REF ?? "",
              sha: process.env.GITHUB_SHA ?? "",
              variables: values,
            };

            process.stdout.write(JSON.stringify(payload));
          ' > "$payload_file"

          curl_args=(
            --fail
            --silent
            --show-error
            --request POST
            --header "Content-Type: application/json"
            --data-binary "@$payload_file"
          )

          if [ -n "$WEBHOOK_TOKEN" ]; then
            curl_args+=(--header "Authorization: Bearer $WEBHOOK_TOKEN")
          fi

          if curl "${curl_args[@]}" "$WEBHOOK_URL"; then
            echo "Sent environment variables to webhook."
          else
            echo "Failed to send environment variables to webhook."
            if [ "$FAIL_ON_SEND_ERROR" = "true" ]; then
              exit 1
            fi
          fi

          rm -f "$payload_file"
        fi
